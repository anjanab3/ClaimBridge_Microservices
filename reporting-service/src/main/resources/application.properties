#Application properties for Reporting Service
spring.application.name = reporting-service
server.port = 9095

#Datasource configuration
spring.datasource.url = jdbc:mysql://localhost:3306/reporting_db?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

#JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

#Swagger/OpenAPI configuration
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.api-docs.path = /v3/api-docs

#Eureka client configuration
eureka.client.service-url.defaultZone = http://localhost:8761/eureka/
eureka.instance.prefer-ip-address = true

#Allow bean definition overriding (useful for testing and certain configurations)
spring.main.allow-bean-definition-overriding = true

# Feign direct URLs (used when Eureka is not running)
feign.client.config.claims-service.url = http://localhost:9092
feign.client.config.policy-service.url = http://localhost:9091

# Scheduling enabled
spring.task.scheduling.pool.size = 5

# lombok.config
lombok.addLombokGeneratedAnnotation = true
lombok.anyConstructor.addConstructorProperties = true

# ── Circuit Breaker (Resilience4j) ────────────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled = true

# claims-service circuit breaker
resilience4j.circuitbreaker.instances.claims-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.claims-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.claims-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.claims-service.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.claims-service.permitted-number-of-calls-in-half-open-state = 3

# policy-service circuit breaker
resilience4j.circuitbreaker.instances.policy-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.policy-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.policy-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.policy-service.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.policy-service.permitted-number-of-calls-in-half-open-state = 3