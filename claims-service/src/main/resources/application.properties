# Application properties for the Claims Service
spring.application.name = claims
server.port = 9092

# Datasource configuration
spring.datasource.url = jdbc:mysql://localhost:3306/claims_db?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger/OpenAPI configuration
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.api-docs.path = /v3/api-docs

# File upload configuration
spring.servlet.multipart.enabled = true
file.upload-dir = C:/Claimbridge/Evidence
spring.servlet.multipart.max-file-size = 10MB
spring.servlet.multipart.max-request-size = 10MB

# Eureka client configuration
eureka.client.service-url.defaultZone = http://localhost:8761/eureka/
eureka.instance.prefer-ip-address = true

# Allow bean definition overriding (useful for testing and certain configurations)
spring.main.allow-bean-definition-overriding = true

# ── Circuit Breaker (Resilience4j) ────────────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled = true

# identity-service circuit breaker
resilience4j.circuitbreaker.instances.identity-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.identity-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.identity-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.identity-service.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.identity-service.permitted-number-of-calls-in-half-open-state = 3

# payment-service circuit breaker
resilience4j.circuitbreaker.instances.payment-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.payment-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.payment-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.payment-service.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.payment-service.permitted-number-of-calls-in-half-open-state = 3

# policy circuit breaker
resilience4j.circuitbreaker.instances.policy.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.policy.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.policy.sliding-window-size = 10
resilience4j.circuitbreaker.instances.policy.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.policy.permitted-number-of-calls-in-half-open-state = 3

# reporting-service circuit breaker
resilience4j.circuitbreaker.instances.reporting-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.reporting-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.reporting-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.reporting-service.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.reporting-service.permitted-number-of-calls-in-half-open-state = 3
