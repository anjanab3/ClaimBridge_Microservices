spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      # Deduplicate CORS headers — downstream services also emit them, causing browser errors
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials

      routes:
        # ── Identity Service (port 9093) ────────────────────────────────────────
        - id: identity-service
          uri: http://localhost:9093
          predicates:
            - Path=/api/identity/**

        # ── Claims Service (port 9092) ───────────────────────────────────────────
        - id: claims-service-claims
          uri: http://localhost:9092
          predicates:
            - Path=/api/claims/**

        - id: claims-service-adjuster
          uri: http://localhost:9092
          predicates:
            - Path=/api/adjuster/**

        - id: claims-service-fraud
          uri: http://localhost:9092
          predicates:
            - Path=/api/fraud/**

        - id: claims-service-investigations
          uri: http://localhost:9092
          predicates:
            - Path=/api/investigations/**

        - id: claims-service-triage
          uri: http://localhost:9092
          predicates:
            - Path=/api/triage/**

        - id: claims-service-notifications
          uri: http://localhost:9092
          predicates:
            - Path=/api/notifications/**

        # ── Policy Service (port 9091) ───────────────────────────────────────────
        - id: policy-service-policies
          uri: http://localhost:9091
          predicates:
            - Path=/api/policies/**

        - id: policy-service-holders
          uri: http://localhost:9091
          predicates:
            - Path=/api/policyholders/**

        - id: policy-service-import
          uri: http://localhost:9091
          predicates:
            - Path=/api/admin/import/**

        # ── Payment Service (port 9094) ──────────────────────────────────────────
        - id: payment-service-payments
          uri: http://localhost:9094
          predicates:
            - Path=/api/payments/**

        - id: payment-service-settlement
          uri: http://localhost:9094
          predicates:
            - Path=/api/settlement/**

        # ── Reporting Service (port 9095) ────────────────────────────────────────
        - id: reporting-service-reporting
          uri: http://localhost:9095
          predicates:
            - Path=/api/reporting/**

        - id: reporting-service-underwriter
          uri: http://localhost:9095
          predicates:
            - Path=/api/underwriter/**

        - id: reporting-service-sla
          uri: http://localhost:9095
          predicates:
            - Path=/api/sla/**

server:
  port: 8085

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: bcf55f70ca05f6a311ec31e304e96e42f511d43836c83da0548fa1b2cb67ec8f

management:
  endpoints:
    web:
      exposure:
        include: health, info
  health:
    eureka:
      enabled: false   # Eureka registration is async; don't let it mark gateway as DOWN

logging:
  level:
    com.cts.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
