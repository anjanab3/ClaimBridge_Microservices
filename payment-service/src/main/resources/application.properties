# Payment Service application properties
spring.application.name = payment-service
server.port = 9094

# Datasource configuration
spring.datasource.url = jdbc:mysql://localhost:3306/payment_db?createDatabaseIfNotExist=true
spring.datasource.username = root
spring.datasource.password = root
spring.datasource.driver-class-name = com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true
spring.jpa.database-platform = org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.naming.physical-strategy = org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Swagger/OpenAPI configuration
springdoc.swagger-ui.path = /swagger-ui.html
springdoc.api-docs.path = /v3/api-docs

# Eureka client configuration
eureka.client.service-url.defaultZone = http://localhost:8761/eureka/
eureka.instance.prefer-ip-address = true

# User details service configuration
claims.service.url = http://localhost:9092

# Reporting service URL (used by ReportingServiceClient for audit logs)
reporting.service.url = http://localhost:9095

# ── Circuit Breaker (Resilience4j) ────────────────────────────────────────────
spring.cloud.openfeign.circuitbreaker.enabled = true

# claims circuit breaker
resilience4j.circuitbreaker.instances.claims.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.claims.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.claims.sliding-window-size = 10
resilience4j.circuitbreaker.instances.claims.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.claims.permitted-number-of-calls-in-half-open-state = 3

# reporting-service circuit breaker
resilience4j.circuitbreaker.instances.reporting-service.failure-rate-threshold = 50
resilience4j.circuitbreaker.instances.reporting-service.minimum-number-of-calls = 5
resilience4j.circuitbreaker.instances.reporting-service.sliding-window-size = 10
resilience4j.circuitbreaker.instances.reporting-service.wait-duration-in-open-state = 10s
resilience4j.circuitbreaker.instances.reporting-service.permitted-number-of-calls-in-half-open-state = 3